name: NeoSI CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neosi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      NEO_SESSION_SECRET: ci-only-secret-at-least-32-bytes-long
      NEO_SCHEDULER_ENABLED: "false"
      SQLITE_DB_PATH: ./data/ci.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Unit and integration tests
        run: bun run test

      - name: Production frontend build
        run: bun run build

      - name: Production Docker image build
        run: docker build --tag neosi-ci .

      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name neosi-smoke -p 127.0.0.1:3100:3000 \
            -e NEO_SESSION_SECRET=ci-session-secret-at-least-32-bytes-long \
            -e NEO_ADMIN_SETUP_TOKEN=ci-admin-setup-token-at-least-32-bytes-long \
            -e NEO_SCHEDULER_ENABLED=false neosi-ci
          trap 'docker rm -f neosi-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/v1/health >/dev/null; then
              echo "Container health endpoint passed."
              exit 0
            fi
            sleep 2
          done
          docker logs neosi-smoke
          exit 1
