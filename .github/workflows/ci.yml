name: NeoSI CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neosi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      NEO_SESSION_SECRET: ci-only-secret-at-least-32-bytes-long
      NEO_SCHEDULER_ENABLED: "false"
      SQLITE_DB_PATH: ./data/ci.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Unit and integration tests
        run: bun run test

      - name: Production frontend build
        run: bun run build

      - name: Production Docker image build
        run: docker build --tag neosi-ci .
