services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: neo_password
      POSTGRES_DB: neo_ai
    ports:
      - "5432:5432"
    volumes:
      - neo_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo -d neo_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - neo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo-ai:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://neo:neo_password@postgres:5432/neo_ai
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  neo_pgdata:
  neo_redisdata:
